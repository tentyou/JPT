name: Android CI & Release

on:
  push:
    branches:
      - main # 触发条件：当 main 分支有 push 时

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设置 JDK 17（适合目前大多数新版 Android Gradle 插件）
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. 授予 Gradle 脚本执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 构建 Release APK
      # 注意：如果你的项目目前没有配置正式的签名(Keystore)，
      # 这里会生成一个未签名的 "app-release-unsigned.apk" 或使用默认配置。
      - name: Build with Gradle
        run: ./gradlew assembleRelease

      # 5. 获取当前时间戳作为版本标识
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      # 6. 自动创建 GitHub Release 并上传 APK 附件
      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ steps:date.outputs.date }}
          name: Release v1.0.0-${{ steps:date.outputs.date }}
          body: |
            这是由 GitHub Actions 自动生成的 Release 版本。
            提交日志: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}